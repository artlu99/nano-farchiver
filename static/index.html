<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>nano-farchiver</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <h1><a href="https://github.com/artlu99/nano-farchiver" target="_blank" rel="noopener noreferrer">nano-farchiver</a>
  </h1>
  <p><a href="https://farcaster.xyz/decent-artlu" target="_blank" rel="noopener noreferrer">Farcaster</a> cast archive.
    <a href="/timeline">Browse</a> with micro-payments.
  </p>
  <ul>
    <li><a href="/llms.txt">llms.txt</a></li>
  </ul>
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Outstanding</th>
        <th>Completed</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>decent-artlu</td>
        <td id="outstanding-all">—</td>
        <td id="completed-all">—</td>
        <td><button type="button" id="run-all">Run</button></td>
      </tr>
    </tbody>
  </table>
  <h2>Archiver run</h2>
  <p><span id="run-badge" class="run-badge idle">idle</span> <span id="run-phase" class="run-phase">—</span></p>
  <div class="run-stats">
    <div class="run-stat"><div class="v" id="run-hydrated">—</div><div class="l">hydrated</div></div>
    <div class="run-stat"><div class="v" id="run-renders">—</div><div class="l">renders</div></div>
    <div class="run-stat" id="run-stat-failures"><div class="v" id="run-failures">—</div><div class="l">failures</div></div>
  </div>
  <p class="run-meta">started <span id="run-started">—</span> · updated <span id="run-updated">—</span></p>
  <p id="run-lastline" class="run-lastline"></p>
  <script src="/static/app.js" defer></script>
  <hr />

    <a href="https://github.com/artlu99/nano-farchiver?tab=MIT-1-ov-file" target="_blank" rel="noopener noreferrer">MIT
      license</a> 2025-present</small>
</body>

</html>
